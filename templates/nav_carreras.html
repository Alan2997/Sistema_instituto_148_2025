<style>
  /* Estilo para resaltar el enlace activo */
  #menu .nav-link.active {
    background-color: #5DB3B7 !important; /* azul Bootstrap */
    color: white !important;
    font-weight: 600;
    border-radius: 6px;
  }

  /* Opcional: transición suave */
  #menu .nav-link {
    transition: background-color 0.3s, color 0.3s;
  }
</style>

<nav role="navigation" id="menu">
  <ul class="nav nav-pills" id="pills-tab">
    <li class="nav-item" role="presentation">
      <a id="carreras-btn" class="nav-link" href="javascript:void(0);" onclick="showTab('carreras')">Carreras</a>
    </li>
    <li class="nav-item" role="presentation">
      <a id="cursos-btn" class="nav-link" href="javascript:void(0);" onclick="showTab('plan_de_estudio')">Plan de Estudio</a>
    </li>
    <!-- <li class="nav-item" role="presentation">
      <a id="cursos-btn" class="nav-link" href="javascript:void(0);" onclick="showTab('cursos')">Cursos</a>
    </li>
    <li class="nav-item" role="presentation">
      <a id="materias-btn" class="nav-link" href="javascript:void(0);" onclick="showTab('materias')">Materias</a>
    </li> -->
  </ul>
</nav>

<script>
window.onload = function() {
  const path = window.location.pathname;

  // Oculta todas las pestañas al inicio
  document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');

  // Quita la clase "active" de todos los enlaces
  document.querySelectorAll('#menu .nav-link').forEach(link => link.classList.remove('active'));

  // Mostrar y marcar la pestaña según la URL
  if (path.includes('carreras')) {
    document.getElementById('carreras').style.display = 'block';
    document.getElementById('carreras-btn').classList.add('active');
  } else if (path.includes('cursos')) {
    document.getElementById('cursos').style.display = 'block';
    document.getElementById('cursos-btn').classList.add('active');
  } else if (path.includes('materias')) {
    document.getElementById('materias').style.display = 'block';
    document.getElementById('materias-btn').classList.add('active');
  }
};

// Redirige al backend al cambiar de pestaña
function showTab(tabId) {
  if (tabId === 'carreras') {
    window.location.href = '/carreras';
  } else if (tabId === 'cursos') {
    window.location.href = '/cursos';
  } else if (tabId === 'materias') {
    window.location.href = '/materias';
  }
}
</script>
