<script>
  function showTab(tabId) {
    // Oculta todas las pestañas
    document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');

    // Muestra la seleccionada
    const activeTab = document.getElementById(tabId);
    if (activeTab) activeTab.style.display = 'block';

    // Actualiza el nav activo
    document.querySelectorAll('#menu .nav-link').forEach(link => link.classList.remove('active'));
    const activeLink = document.getElementById(tabId + '-btn');
    if (activeLink) activeLink.classList.add('active');
  }

  document.addEventListener('DOMContentLoaded', function () {
    // Detectar qué pestaña mostrar según el backend
    const defaultTab = "{{ table or 'carreras' }}";
    showTab(defaultTab);
  });
</script>


<nav role="navigation" id="menu">
  <ul class="nav nav-pills" id="pills-tab">
    <li class="nav-item" role="presentation">
      <a class="flex-sm-fill text-sm-center nav-link" id="carreras-btn" href="#" onclick="showTab('carreras')">
        Carreras
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="flex-sm-fill text-sm-center nav-link" id="cursos-btn" href="#" onclick="showTab('cursos')">
        Cursos
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="flex-sm-fill text-sm-center nav-link" id="materias-btn" href="#" onclick="showTab('materias')">
        Materias
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="flex-sm-fill text-sm-center nav-link" id="matriculacion-btn" href="#" onclick="showTab('matriculacion')">
        Matriculación
      </a>
    </li>
  </ul>
</nav>
