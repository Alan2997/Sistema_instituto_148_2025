<script>
function showTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
  const activeTab = document.getElementById(tabId);
  if (activeTab) activeTab.style.display = 'block';

  document.querySelectorAll('#menu .nav-link').forEach(link => link.classList.remove('active'));
  const activeLink = document.getElementById(tabId + '-btn');
  if (activeLink) activeLink.classList.add('active');

  // Si la pestaña es "materias", pedimos al backend los datos vía AJAX
  if (tabId === 'materias') {
    fetch('/materias')
      .then(resp => resp.text())
      .then(html => {
        const parser = new DOMParser();
        const newDoc = parser.parseFromString(html, 'text/html');
        const newContent = newDoc.querySelector('#materias');
        if (newContent) activeTab.innerHTML = newContent.innerHTML;
      });
  }
}

window.onload = function() {
  const table = '{{ table }}';
  if (table === 'cursos') {
    showTab('cursos');
  } else if (table === 'carreras_inactivas') {
    showTab('carreras_inactivas');
  } else {
    showTab('carreras');  // por defecto
  }
};


// Mostrar la pestaña por defecto al cargar la página
window.addEventListener("DOMContentLoaded", function() {
  showTab('carreras'); // o 'cursos' si querés abrir cursos por defecto
});
</script>

<nav role="navigation" id="menu">
  <ul class="nav nav-pills" id="pills-tab">
    <li class="nav-item" role="presentation">
      <a class="nav-link" href="{{ url_for('carreras') }}">Carreras</a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link active" href="{{ url_for('cursos') }}">Cursos</a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link" href="#" onclick="showTab('materias')">Materias</a>
    </li>
  </ul>
</nav>
